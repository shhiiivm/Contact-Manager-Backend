<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content}, 'View Contact', ~{::script})}"
    xmlns:th="http://www.w3.org/1999/xhtml">

<body>
    <div id="content">
        <!-- sidebar -->

        <!-- user is logged in : sidebar -->

        <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar :: sidebar}"></div>
        </div>

        <div class="sm:pl-64 pt-20" style="height: 1000px">
            <div class="grid grid-cols-12">
                <div class="col-span-3"></div>
                <div class="col-span-12 md:col-span-6">
                    <div
                        class="card block p-6 bg-white border border-gray-200 rounded-lg shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">
                        <div data-th-replace="message::messagebox"></div>

                        <h1 class="text-2xl font-semibold">Contact Details</h1>
                        <p class="text-gray-500">
                            View your contact information...
                        </p>

                        <div class="mt-8">
                            <!-- Contact Image -->
                            <div class="flex justify-center mb-6">
                                <!-- Display user icon if no picture is available -->
                                <div th:if="${contact.picture == null or contact.picture.isEmpty()}"
                                    class="w-32 h-32 rounded-full bg-gray-200 flex items-center justify-center">
                                    <i class="fa-solid fa-user text-gray-500 text-4xl"></i>
                                </div>
                                <!-- Display contact picture if available -->
                                <img th:unless="${contact.picture == null or contact.picture.isEmpty()}"
                                    id="contactImage" th:src="${contact.picture}" alt="Contact Image"
                                    class="w-32 h-32 rounded-full object-cover border border-gray-300">
                            </div>

                            <!-- Contact Information -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- Name -->
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Name
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <span th:text="${contact.name}" class="text-gray-900 dark:text-white"></span>
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Email
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <span th:text="${contact.email}" class="text-gray-900 dark:text-white"></span>
                                    </div>
                                </div>

                                <!-- Phone Number -->
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Phone Number
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <span th:text="${contact.phoneNumber}"
                                            class="text-gray-900 dark:text-white"></span>
                                    </div>
                                </div>

                                <!-- Favorite Status -->
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Favorite
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <span th:if="${contact.favourite}" class="text-yellow-500">
                                            <i class="fas fa-star"></i> Favorite Contact
                                        </span>
                                        <span th:unless="${contact.favourite}" class="text-gray-900 dark:text-white">
                                            Not a Favorite Contact
                                        </span>
                                    </div>
                                </div>

                                <!-- Address -->
                                <div class="mb-4 md:col-span-2">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Address
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <span th:text="${contact.address}" class="text-gray-900 dark:text-white"></span>
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="mb-4 md:col-span-2">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Description
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded min-h-[60px]">
                                        <span th:text="${contact.description}"
                                            class="text-gray-900 dark:text-white"></span>
                                    </div>
                                </div>

                                <!-- Website Link -->
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Website
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <a th:if="${contact.websiteLink}" th:href="${contact.websiteLink}"
                                            target="_blank" class="text-blue-600 dark:text-blue-400 hover:underline"
                                            th:text="${contact.websiteLink}"></a>
                                        <span th:unless="${contact.websiteLink}"
                                            class="text-gray-900 dark:text-white">N/A</span>
                                    </div>
                                </div>

                                <!-- LinkedIn Link -->
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        LinkedIn
                                    </label>
                                    <div class="p-2 bg-gray-50 dark:bg-gray-700 rounded">
                                        <a th:if="${contact.linkedInLink}" th:href="${contact.linkedInLink}"
                                            target="_blank" class="text-blue-600 dark:text-blue-400 hover:underline"
                                            th:text="${contact.linkedInLink}"></a>
                                        <span th:unless="${contact.linkedInLink}"
                                            class="text-gray-900 dark:text-white">N/A</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex justify-center space-x-4 mt-8">
                                <a th:href="@{/user/contacts}"
                                    class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">
                                    Back to Contacts
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script data-th-src="@{'/js/admin.js'}"></script>
    <script>
        console.log("this is view contact page");
    </script>
</body>

</html>
